number_words:
  1: ["ek", "এক"]
  2: ["dui", "দুই"]
  3: ["tin", "তিন"]
  4: ["char", "চার"]
  5: ["panch", "পাঁচ"]
  6: ["chhoy", "ছয়"]
  7: ["shat", "সাত"]
  8: ["aat", "আট"]
  9: ["noy", "নয়"]
  10: ["dosh", "দশ"]

date_words:
  today: ["aaj", "আজ", "ajke", "আজকে"]
  yesterday: ["gotokal", "গতকাল"]
  tomorrow: ["agamikal", "আগামীকাল"]
  # Both yesterday and tomorrow. The parser defaults to yesterday and sets ambiguous=true.
  kal: ["kal", "কাল"]
  # Both the day before yesterday and the day after tomorrow. Default is the day before yesterday.
  porshu: ["porshu", "পরশু"]

yes_words: ["hyan", "হ্যাঁ", "ha", "thik ache", "ঠিক আছে"]
no_words: ["na", "না"]

correction_words: ["bhul", "ভুল", "bodlao", "বদলাও", "sudhro", "সংশোধন", "change"]

# Words that mark the following number as a count correction, e.g. "count 3".
count_words: ["count", "sonkhya", "সংখ্যা"]

clinical_keywords:
